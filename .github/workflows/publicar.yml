# Cada cambio en main (por ejemplo, un artículo nuevo en articulos/) vuelve a generar el sitio y lo publica.
# Si un artículo está mal escrito, build.py falla y la página sigue como estaba (el error sale en la pestaña Actions).
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"  # 06:15 en Ecuador: publica los artículos programados para hoy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
